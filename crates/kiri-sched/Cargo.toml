[package]
name = "kiri-sched"
description = "GPU scheduler and supervisor for a Kiri GPU server: one front door, one runtime on the GPUs at a time"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kiri-sched"
path = "src/main.rs"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "process", "signal", "io-util", "fs"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
