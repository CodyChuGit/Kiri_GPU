# kiri-sched GPU runtime "maya-glm" (replaces ~/llm/container/use + krun). Started and
# stopped only by kiri-sched through kiri-run@maya-glm.service; never run it by hand.
name: maya-glm
services:
  engine:
    image: box-runtime:1
    container_name: rt-maya-glm
    network_mode: host
    ipc: host
    restart: "no"
    labels:
      dev.kiri.sched.runtime: maya-glm
    working_dir: /home/rtx3090/llm/engines/project-maya
    command: ["./run-maya-maya-s-v2-iq2_xxs.sh"]
    environment:
      HOME: /home/rtx3090
      PYTHONUNBUFFERED: "1"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - /home/rtx3090/llm:/home/rtx3090/llm
      - /models:/models
      - /cache:/cache
      - /usr/local/cuda-13.1:/usr/local/cuda-13.1:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 20s
