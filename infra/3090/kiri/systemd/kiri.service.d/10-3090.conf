# Drop-in for the kiri.service unit shipped by the Kiri .deb (Kiri_GPU fork build).
# Install: /etc/systemd/system/kiri.service.d/10-3090.conf, then `systemctl daemon-reload`.
#
# Goals:
#  - The CDI spec is fresh (matches the loaded driver) before Kiri starts.
#  - systemd restarts the Kiri daemon if it dies, without an endless crash loop.
#  - Nothing in the core host (networkd, 25GbE link to the NAS, Tailscale, SSH)
#    depends on Kiri. Do NOT add Before=/RequiredBy= links from those units.
[Unit]
After=network-online.target box-cdi-refresh.service
Wants=network-online.target box-cdi-refresh.service
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Restart=always
RestartSec=10
# GPU jobs flush checkpoints on SIGTERM; give them time.
TimeoutStopSec=120
# The kernel should kill a runaway container before it kills sshd or tailscaled.
OOMScoreAdjust=-200
